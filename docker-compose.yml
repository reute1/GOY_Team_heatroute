# docker-compose 1.29.2: docker-compose up -d --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: heatroute
      POSTGRES_USER: heatroute
      POSTGRES_PASSWORD: heatroute
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heatroute -d heatroute"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/heatroute
      DB_USER: heatroute
      DB_PASSWORD: heatroute
      STORAGE_DIR: /data/jobs
      WORKERS: "2"
      JAVA_OPTS: "-Xms512m -Xmx12g -Djava.io.tmpdir=/data/tmp"
    volumes:
      - jobs:/data
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  pgdata:
  jobs:
